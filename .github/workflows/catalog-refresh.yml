name: Z5 Catalog Validation
permissions:
  contents: write
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-catalog.mjs
      - run: node scripts/ingest-catalog.mjs
        env:
          Z5_CATALOG_FEED_URL: ${{ secrets.Z5_CATALOG_FEED_URL }}
          Z5_CATALOG_FEED_TOKEN: ${{ secrets.Z5_CATALOG_FEED_TOKEN }}